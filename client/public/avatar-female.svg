<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="100%" height="100%">
  <defs>
    <!-- Studio Portrait Background Gradient -->
    <linearGradient id="femaleBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E5E7EB" />
      <stop offset="100%" stop-color="#D1D5DB" />
    </linearGradient>

    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.08" />
    </filter>
  </defs>

  <!-- Full-card background -->
  <rect width="400" height="500" fill="url(#femaleBg)" />

  <!-- Female Profile Silhouette Illustration -->
  <g filter="url(#cardShadow)">
    <!-- Back Hair Volume (behind shoulders) -->
    <path d="M 125 180 
             C 115 250, 105 320, 120 380 
             C 135 430, 160 450, 160 450 
             L 240 450 
             C 240 450, 265 430, 280 380 
             C 295 320, 285 250, 275 180 
             Z" 
          fill="#ECECF0" />

    <!-- Feminine Shoulders & Torso -->
    <path d="M 40 500 
             C 55 435, 95 365, 145 335 
             L 168 318 
             L 168 260 
             C 168 260, 184 272, 200 272 
             C 216 272, 232 260, 232 260 
             L 232 318 
             L 255 335 
             C 305 365, 345 435, 360 500 
             Z" 
          fill="#FFFFFF" />

    <!-- Elegant Slender Neck & Head Base -->
    <ellipse cx="200" cy="180" rx="56" ry="68" fill="#FFFFFF" />

    <!-- Lady Long Hair Styling (Framing the face and cascading down shoulders) -->
    <path d="M 200 88 
             C 145 88, 124 125, 122 175 
             C 120 220, 128 270, 134 330 
             C 137 360, 155 375, 168 360 
             C 175 350, 172 320, 170 280 
             C 168 250, 160 215, 168 185 
             C 174 160, 185 142, 200 142 
             C 215 142, 226 160, 232 185 
             C 240 215, 232 250, 230 280 
             C 228 320, 225 350, 232 360 
             C 245 375, 263 360, 266 330 
             C 272 270, 280 220, 278 175 
             C 276 125, 255 88, 200 88 
             Z" 
          fill="#F5F5F7" 
          stroke="#E5E7EB" 
          stroke-width="3" />

    <!-- Elegant Collarbone Accent -->
    <path d="M 175 355 Q 200 365 225 355" fill="none" stroke="#D1D5DB" stroke-width="2.5" stroke-linecap="round" />
  </g>
</svg>
